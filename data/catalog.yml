hlo:
  name: Harmonized Learning Outcomes
  url: https://datatopics.worldbank.org/education/
  auth_required: no
  methodology_cite: Patrinos & Angrist (2018); Altinok, Angrist & Patrinos (2018)
  notes: ADR-0004 pins specific version; default HD.HCI.HLOS via WDI API; sensitivity
    at AAP-2018
oecd_crs:
  name: OECD DAC Creditor Reporting System
  url: https://data-explorer.oecd.org/vis?fs[0]=Topic%2C0%7CDevelopment%23DEV%23&pg=0&fc=Topic&bp=true&snb=22&df[ds]=dsDisseminateFinalDMZ&df[id]=DSD_CRS%40DF_CRS&df[ag]=OECD.DCD.FSD&df[vs]=1.4
  auth_required: no
  methodology_cite: OECD DAC (annual CRS release)
  notes: Sector codes 110/111/112/113/114; retain description text for ADR-0007 typology
    coding; ADR-0005 stub for commitment vs disbursement
aiddata_core:
  name: AidData Core Research Release
  url: https://www.aiddata.org/data
  auth_required: no
  methodology_cite: AidData (Tierney et al.)
  notes: DAC + non-DAC project-level; coverage ~2000-2014
aiddata_gcdf:
  name: AidData Global Chinese Development Finance v3.0
  url: https://www.aiddata.org/data/aiddatas-global-chinese-development-finance-dataset-version-3-0
  auth_required: no
  methodology_cite: AidData TUFF methodology; Custer et al.
  notes: China-specific aid; complements OECD CRS (China is not DAC member)
uis:
  name: UNESCO Institute for Statistics
  url: https://uis.unesco.org/
  auth_required: no
  methodology_cite: UNESCO Institute for Statistics (annual)
  notes: Private expenditure share, out-of-school rates; SSA missingness severe pre-2015;
    feeds ADR-0006
ucdp:
  name: UCDP/PRIO Armed Conflict Dataset
  url: https://ucdp.uu.se/downloads/
  auth_required: no
  methodology_cite: Pettersson, Davies et al. (annual UCDP release)
  notes: Country-year version (not GED); pin version in catalog at access time
covid_closures:
  name: UNESCO COVID-19 School Closures
  url: https://covid19.uis.unesco.org/global-monitoring-school-closures-covid19/country-dashboard/
  auth_required: no
  methodology_cite: UNESCO COVID-19 Monitoring of School Closures
  notes: Total/partial closure days 2020-2022 by country
ai_readiness:
  name: Oxford Insights AI Readiness Index
  url: https://oxfordinsights.com/ai-readiness/
  auth_required: no
  methodology_cite: Oxford Insights (annual; methodology revised each edition)
  notes: Cross-sectional in our use (single edition, most recent covering target window)
